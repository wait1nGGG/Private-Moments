<!DOCTYPE html>
<html lang="zh">
<head>
    <title>Moments</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        :root {
            --primary: #07C160;
            --primary-dim: #06a050;
            --moments-bg: rgb(28, 28, 32);
            --text-main: #e8e8ea;
            --text-sub: #8e8e93;
            --border-subtle: rgba(255,255,255,0.06);
            --surface-hover: rgba(255,255,255,0.04);
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
            --cover-default: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            margin: 0;
            background-color: #1a1a1a;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            transition: background-image 0.5s ease;
        }

        .container { width: 100%; max-width: 520px; height: 100vh; position: relative; background: transparent; }
        .hidden { display: none !important; }

        #lockScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
        }
        #lockScreen.fade-out { opacity: 0; pointer-events: none; }
        #lockScreen .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(30px) saturate(140%);
            -webkit-backdrop-filter: blur(30px) saturate(140%);
            padding: 44px 36px 36px; border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            width: 88%; max-width: 340px; text-align: center;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
        }
        #lockScreen .lock-avatar {
            width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2); margin-bottom: 12px;
        }
        #lockScreen .lock-name { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 20px; }
        #lockScreen input[type="password"] {
            width: 100%; padding: 14px; border-radius: 14px; border: none;
            background: rgba(255,255,255,0.12); color: #fff; font-size: 16px;
            text-align: center; outline: none; letter-spacing: 3px;
            transition: background 0.2s, box-shadow 0.2s; margin-bottom: 16px;
        }
        #lockScreen input[type="password"]:focus {
            background: rgba(255,255,255,0.18); box-shadow: 0 0 0 2px rgba(7,193,96,0.3);
        }
        #lockScreen input::placeholder { color: rgba(255,255,255,0.3); letter-spacing: 0; }
        #lockScreen .btn-unlock {
            background: var(--primary); color: #fff; padding: 10px 36px; border-radius: 14px;
            border: none; font-weight: 600; font-size: 15px; cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        #lockScreen .btn-unlock:active { transform: scale(0.96); }
        #lockScreen .msg { color: #ff4757; font-size: 12px; margin-top: 8px; min-height: 18px; }

        #mainContent {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; display: flex; flex-direction: column;
            opacity: 0; transition: opacity 0.3s ease;
        }
        #mainContent.show { opacity: 1; }

        .moments-wrapper {
            margin: 3vh auto; width: 97%; height: 94vh;
            background: var(--moments-bg); border-radius: 26px;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04) inset;
            position: relative; scroll-behavior: smooth; scrollbar-width: none;
        }
        .moments-wrapper::-webkit-scrollbar { display: none; }

        .cover-area {
            width: 100%; height: 270px; background-size: cover; background-position: center;
            position: relative; border-radius: 26px 26px 0 0;
            background-image: var(--cover-default);
        }
        .cover-area::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0;
            height: 60px; background: linear-gradient(transparent, var(--moments-bg)); pointer-events: none;
        }

        .settings-btn {
            position: absolute; top: 14px; right: 14px;
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(0,0,0,0.35); backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 17px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 20; transition: background 0.2s, transform 0.2s;
        }
        .settings-btn:hover { background: rgba(0,0,0,0.55); }
        .settings-btn:active { transform: scale(0.92); }

        .user-info {
            position: absolute; right: 24px; bottom: -18px;
            display: flex; align-items: flex-start; gap: 14px; z-index: 10;
        }
        .nickname {
            color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            font-size: 20px; font-weight: 700; margin-top: 14px; line-height: 1;
        }
        .avatar {
            width: 74px; height: 74px; border-radius: 14px;
            border: 2.5px solid rgba(255,255,255,0.15); object-fit: cover;
            background: #1c1c20; flex-shrink: 0; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        .bio-section {
            padding: 38px 24px 8px; text-align: right;
            color: var(--text-sub); font-size: 13px; font-weight: 400;
        }

        .post-box {
            margin: 12px 16px; padding: 16px;
            background: var(--surface-hover); border-radius: 16px;
            border: 1px solid var(--border-subtle);
        }
        textarea {
            width: 100%; height: 52px; border: none; background: transparent;
            font-size: 15px; outline: none; resize: none;
            color: var(--text-main); font-family: var(--font-sans); line-height: 1.5;
        }
        textarea::placeholder { color: var(--text-sub); }

        .feed-item {
            padding: 18px 20px; border-bottom: 1px solid var(--border-subtle);
            display: flex; gap: 13px; position: relative; transition: background 0.15s;
        }
        .feed-item:hover { background: var(--surface-hover); }
        .feed-avatar {
            width: 42px; height: 42px; border-radius: 8px;
            flex-shrink: 0; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .feed-content { flex: 1; min-width: 0; }
        .feed-content > b { font-size: 15px; font-weight: 600; color: #c8d6e5; }
        .feed-text {
            margin-top: 4px; line-height: 1.6; font-size: 15px;
            white-space: pre-wrap; word-wrap: break-word; word-break: break-word;
        }
        .feed-time { color: var(--text-sub); font-size: 12px; margin-top: 10px; font-weight: 400; }

        .post-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 12px; border-top: 1px solid var(--border-subtle); padding-top: 12px;
        }
        .action-btn {
            cursor: pointer; color: #07C160; font-size: 13px; font-weight: 500;
            display: flex; align-items: center; gap: 5px; transition: opacity 0.15s; user-select: none;
        }
        .action-btn:hover { opacity: 0.8; }
        .btn-post {
            background: var(--primary); color: #fff; padding: 6px 18px; border-radius: 14px;
            border: none; font-weight: 600; font-size: 13px; cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        .btn-post:active { transform: scale(0.95); }

        .delete-btn {
            position: absolute; right: 18px; bottom: 14px; font-size: 12px;
            color: var(--text-sub); cursor: pointer; opacity: 0; transition: opacity 0.2s;
            padding: 4px 10px; border-radius: 6px; font-weight: 500; user-select: none;
        }
        .feed-item:hover .delete-btn { opacity: 0.5; }
        .delete-btn:hover { opacity: 1 !important; color: #ff4757; }

        #linkInputArea {
            max-height: 0; overflow: hidden; opacity: 0; transition: all 0.25s ease; margin-top: 0;
        }
        #linkInputArea.show { max-height: 52px; opacity: 1; margin-top: 10px; }
        #postLink {
            width: 100%; padding: 11px 12px; border-radius: 10px; border: none;
            background: rgba(255,255,255,0.06); color: var(--text-main); font-size: 13px;
            outline: none; font-family: var(--font-sans); transition: background 0.2s;
        }
        #postLink:focus { background: rgba(255,255,255,0.1); }
        #postLink::placeholder { color: var(--text-sub); }

        #settingsOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 900; opacity: 0;
            transition: opacity 0.25s ease; pointer-events: none;
        }
        #settingsOverlay.show { opacity: 1; pointer-events: auto; }

        #settingsPanel {
            position: fixed; top: 0; right: 0; width: 340px; max-width: 88vw; height: 100%;
            background: rgb(22,22,26); z-index: 910;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            display: flex; flex-direction: column;
            box-shadow: -8px 0 32px rgba(0,0,0,0.5);
            border-left: 1px solid rgba(255,255,255,0.06);
        }
        #settingsPanel.show { transform: translateX(0); }

        .settings-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px; border-bottom: 1px solid var(--border-subtle);
        }
        .settings-header h3 { margin: 0; font-size: 18px; font-weight: 600; }
        .settings-close {
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.06); border: none; color: var(--text-sub);
            font-size: 18px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: background 0.15s;
        }
        .settings-close:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .settings-body {
            flex: 1; overflow-y: auto; padding: 20px 24px; scrollbar-width: none;
        }
        .settings-body::-webkit-scrollbar { display: none; }

        .settings-field { margin-bottom: 24px; }
        .settings-field label {
            display: block; font-size: 12px; font-weight: 600; color: var(--text-sub);
            letter-spacing: 0.04em; margin-bottom: 8px;
        }
        .settings-field input[type="text"] {
            width: 100%; padding: 11px 14px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04); color: var(--text-main);
            font-size: 14px; outline: none; font-family: var(--font-sans);
            transition: border-color 0.2s, background 0.2s;
        }
        .settings-field input[type="text"]:focus {
            border-color: var(--primary); background: rgba(255,255,255,0.08);
        }
        .settings-field .hint { font-size: 11px; color: var(--text-sub); margin-top: 4px; opacity: 0.7; }

        .settings-field .img-row { display: flex; align-items: center; gap: 12px; }
        .settings-field .img-preview {
            width: 64px; height: 64px; border-radius: 10px; object-fit: cover;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }
        .settings-field .img-actions { display: flex; flex-direction: column; gap: 8px; }
        .btn-upload {
            background: var(--primary); color: #fff; padding: 7px 16px; border-radius: 10px;
            border: none; font-weight: 600; font-size: 13px; cursor: pointer;
            transition: background 0.15s; white-space: nowrap;
        }
        .btn-upload:hover { background: var(--primary-dim); }
        .btn-reset {
            background: rgba(255,255,255,0.06); color: var(--text-sub); padding: 7px 16px;
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);
            font-weight: 500; font-size: 13px; cursor: pointer; transition: background 0.15s; white-space: nowrap;
        }
        .btn-reset:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .settings-footer {
            padding: 16px 24px; border-top: 1px solid var(--border-subtle);
            display: flex; gap: 10px;
        }
        .btn-save {
            flex: 1; background: var(--primary); color: #fff; padding: 12px;
            border-radius: 14px; border: none; font-weight: 600; font-size: 15px;
            cursor: pointer; transition: background 0.15s;
        }
        .btn-save:hover { background: var(--primary-dim); }
        .btn-cancel {
            flex: 0.6; background: rgba(255,255,255,0.06); color: var(--text-sub);
            padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.06);
            font-weight: 500; font-size: 15px; cursor: pointer; transition: background 0.15s;
        }
        .btn-cancel:hover { background: rgba(255,255,255,0.1); }

        .viewer-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.25s ease; user-select: none; -webkit-user-select: none;
        }
        .viewer-modal.show { opacity: 1; }
        .viewer-modal.hidden { display: none !important; }

        .viewer-top-bar {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; z-index: 10;
            background: linear-gradient(rgba(0,0,0,0.5), transparent);
        }
        .viewer-counter { color: #fff; font-size: 15px; font-weight: 500; }
        .close-viewer {
            color: #fff; font-size: 36px; font-weight: 300; cursor: pointer;
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: background 0.2s; line-height: 1;
        }
        .close-viewer:hover { background: rgba(255,255,255,0.1); }

        .viewer-body { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 60px 16px; }
        #viewerImg { max-width: 92vw; max-height: 82vh; border-radius: 8px; object-fit: contain; transition: opacity 0.2s ease; }

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); color: #fff; font-size: 22px;
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, opacity 0.2s; z-index: 10; font-weight: 300;
        }
        .nav-arrow:hover { background: rgba(255,255,255,0.18); }
        .nav-arrow.hidden { opacity: 0; pointer-events: none; }
        .nav-prev { left: 12px; }
        .nav-next { right: 12px; }

        .grid-container { display: grid !important; gap: 3px !important; margin: 10px 0 !important; width: 100% !important; max-width: 100%; border-radius: 6px; overflow: hidden; }
        .grid-2col { grid-template-columns: repeat(2, 1fr) !important; width: 70% !important; }
        .grid-3col { grid-template-columns: repeat(3, 1fr) !important; width: 100% !important; }
        .grid-item { width: 100% !important; height: 0 !important; padding-bottom: 100% !important; position: relative !important; cursor: pointer; overflow: hidden; }
        .grid-item img { position: absolute !important; width: 100% !important; height: 100% !important; top: 0 !important; left: 0 !important; object-fit: cover !important; transition: transform 0.2s; }
        .grid-item:hover img { transform: scale(1.06); }
        .grid-more-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: 600; z-index: 2; pointer-events: none; }
        .single-img { width: auto !important; max-width: 85% !important; max-height: 350px !important; height: auto !important; display: block; margin: 10px 0; border-radius: 6px; cursor: pointer; transition: opacity 0.15s; }
        .single-img:hover { opacity: 0.85; }

        @media (max-width: 480px) {
            .moments-wrapper { margin: 2vh auto; width: 99%; height: 96vh; border-radius: 20px; }
            .cover-area { border-radius: 20px 20px 0 0; }
            #settingsPanel { width: 100%; max-width: 100%; }
        }
    </style>
</head>

<body>

<div class="container">
    <div id="lockScreen" class="hidden">
        <div class="card">
            <img id="lockAvatar" class="lock-avatar" src="uploads/default/default.jpg" alt="">
            <div class="lock-name" id="lockName">User</div>
            <input type="password" id="keyInput" placeholder="输入密钥" onkeydown="if(event.key==='Enter')doUnlock()" autofocus>
            <button class="btn-unlock" onclick="doUnlock()">解锁</button>
            <div class="msg" id="lockMsg"></div>
        </div>
    </div>

    <div id="settingsOverlay" onclick="closeSettings()"></div>

    <div id="settingsPanel">
        <div class="settings-header">
            <h3>设置</h3>
            <button class="settings-close" onclick="closeSettings()">&times;</button>
        </div>
        <div class="settings-body">
            <div class="settings-field">
                <label>头像</label>
                <div class="img-row">
                    <img id="previewAvatar" class="img-preview" src="uploads/default/default.jpg" alt="">
                    <div class="img-actions">
                        <button class="btn-upload" onclick="document.getElementById('fileAvatar').click()">上传图片</button>
                        <button class="btn-reset" onclick="resetSettingsImg('avatar')">恢复默认</button>
                    </div>
                </div>
                <input type="file" id="fileAvatar" accept="image/*" hidden onchange="previewFile(this, 'previewAvatar', 'avatarFile')">
                <div class="hint">建议正方形图片，留空使用默认头像</div>
            </div>
            <div class="settings-field">
                <label>昵称</label>
                <input type="text" id="setNickname" placeholder="User">
            </div>
            <div class="settings-field">
                <label>封面图片</label>
                <div class="img-row">
                    <img id="previewCover" class="img-preview" src="" alt="" style="background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);">
                    <div class="img-actions">
                        <button class="btn-upload" onclick="document.getElementById('fileCover').click()">上传图片</button>
                        <button class="btn-reset" onclick="resetSettingsImg('cover')">恢复默认</button>
                    </div>
                </div>
                <input type="file" id="fileCover" accept="image/*" hidden onchange="previewFile(this, 'previewCover', 'coverFile')">
                <div class="hint">留空使用默认深蓝渐变</div>
            </div>
            <div class="settings-field">
                <label>窗口背景</label>
                <div class="img-row">
                    <img id="previewBg" class="img-preview" src="" alt="" style="background:#1a1a1a;">
                    <div class="img-actions">
                        <button class="btn-upload" onclick="document.getElementById('fileBg').click()">上传图片</button>
                        <button class="btn-reset" onclick="resetSettingsImg('bg')">恢复默认</button>
                    </div>
                </div>
                <input type="file" id="fileBg" accept="image/*" hidden onchange="previewFile(this, 'previewBg', 'bgFile')">
                <div class="hint">留空使用纯深色背景</div>
            </div>
            <div class="settings-field">
                <label>访问密钥</label>
                <input type="text" id="setKey" placeholder="留空则无需密钥">
                <div class="hint">设置后下次进入需要验证。留空则清除密钥保护</div>
            </div>
            <div class="settings-field">
                <label>服务器端口</label>
                <input type="text" id="setPort" placeholder="25565">
                <div class="hint">修改后需要重启服务器才能生效</div>
            </div>
            <div class="settings-field">
                <label>备份与恢复</label>
                <div style="display:flex;flex-direction:column;gap:8px;">
                    <button class="btn-upload" onclick="createBackup()" id="btnBackup" style="width:100%;text-align:center;">创建备份</button>
                    <div style="display:flex;gap:8px;">
                        <button class="btn-reset" onclick="downloadBackup()" id="btnDownload" style="flex:1;text-align:center;">下载备份</button>
                        <button class="btn-reset" onclick="document.getElementById('fileRestore').click()" style="flex:1;text-align:center;">恢复备份</button>
                    </div>
                    <input type="file" id="fileRestore" accept=".zip" hidden onchange="restoreBackup(this)">
                </div>
                <div class="hint" id="backupMsg" style="margin-top:6px;"></div>
            </div>
        </div>
        <div class="settings-footer">
            <button class="btn-cancel" onclick="closeSettings()">取消</button>
            <button class="btn-save" onclick="saveSettings()">保存</button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <div class="moments-wrapper">
            <div id="coverArea" class="cover-area">
                <button class="settings-btn" onclick="openSettings()" title="设置">&#9881;</button>
                <div class="user-info">
                    <span id="myNickname" class="nickname">User</span>
                    <img id="myAvatar" class="avatar" src="uploads/default/default.jpg" alt="">
                </div>
            </div>

            <div id="myBio" class="bio-section"></div>

            <div class="post-box">
                <textarea id="postText" placeholder="分享你的想法..."></textarea>
                <div id="linkInputArea">
                    <input type="url" id="postLink" placeholder="粘贴音乐链接（如 Spotify）">
                </div>
                <div class="post-actions">
                    <div style="display: flex; gap: 18px;">
                        <label for="postFiles" class="action-btn">
                            <span id="fileNameLabel">图片</span>
                        </label>
                        <input type="file" id="postFiles" name="images" accept="image/*" multiple style="display: none;"
                            onchange="const c=this.files.length;document.getElementById('fileNameLabel').innerText=c>1?c+' 张图片':(this.files[0]?this.files[0].name:'图片')">
                        <div id="linkLabel" class="action-btn" onclick="toggleLinkInput()">
                            <span>音乐</span>
                        </div>
                    </div>
                    <button class="btn-post" onclick="sendPost()">发布</button>
                </div>
            </div>

            <div id="feed"></div>
        </div>
    </div>
</div>

<div id="imageViewer" class="viewer-modal hidden">
    <div class="viewer-top-bar">
        <span id="viewerCounter" class="viewer-counter"></span>
        <span class="close-viewer" onclick="closeImageViewer()">&times;</span>
    </div>
    <div class="viewer-body" onclick="closeImageViewer()">
        <button class="nav-arrow nav-prev hidden" id="navPrev" onclick="event.stopPropagation();navigateViewer(-1)">&#8249;</button>
        <img id="viewerImg" src="" onclick="event.stopPropagation()">
        <button class="nav-arrow nav-next hidden" id="navNext" onclick="event.stopPropagation();navigateViewer(1)">&#8250;</button>
    </div>
</div>

<script>
const DEFAULT_AVATAR = 'uploads/default/default.jpg';
let userConfig = { nickname: 'User', avatar: DEFAULT_AVATAR, cover: '', bg: '', key: '', hasKey: false, port: 25565 };
let pendingFiles = { avatarFile: null, coverFile: null, bgFile: null };
let viewerImages = [], viewerIndex = 0;

// ===================== 初始化 =====================
async function init() {
    userConfig = await loadConfig();
    applyConfig(userConfig);
    if (userConfig.hasKey) showLockScreen(); else showMainContent();

    // Enter 发送（IME 安全：输入法组合文字期间不触发）
    const textarea = document.getElementById('postText');
    let composing = false;
    textarea.addEventListener('compositionstart', () => composing = true);
    textarea.addEventListener('compositionend', () => composing = false);
    textarea.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !composing && !e.isComposing) {
            e.preventDefault();
            sendPost();
        }
    });
}

// ===================== 配置 =====================
async function loadConfig() {
    const r = await fetch('/api/config'); return await r.json();
}

async function saveConfig(cfg) {
    await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
}

function applyConfig(cfg) {
    document.getElementById('myNickname').innerText = cfg.nickname || 'User';
    document.getElementById('lockName').innerText = cfg.nickname || 'User';
    document.getElementById('myAvatar').src = cfg.avatar || DEFAULT_AVATAR;
    document.getElementById('lockAvatar').src = cfg.avatar || DEFAULT_AVATAR;
    const c = document.getElementById('coverArea');
    c.style.backgroundImage = cfg.cover ? `url(${cfg.cover})` : 'var(--cover-default)';
    document.body.style.backgroundImage = cfg.bg ? `url(${cfg.bg})` : '';
    if (!cfg.bg) document.body.style.backgroundColor = '#1a1a1a';
}

// ===================== 登录 =====================
function showLockScreen() { document.getElementById('lockScreen').classList.remove('hidden'); const m = document.getElementById('mainContent'); m.classList.add('hidden'); m.classList.remove('show'); document.getElementById('keyInput').focus(); }

async function doUnlock() {
    const key = document.getElementById('keyInput').value;
    const ok = (await fetch('/api/verify-key', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) })).ok;
    if (ok) { document.getElementById('lockMsg').textContent = ''; userConfig.key = key; showMainContent(); }
    else { document.getElementById('lockMsg').textContent = '密钥错误'; document.getElementById('keyInput').value = ''; document.getElementById('keyInput').focus(); }
}

function showMainContent() { const ls = document.getElementById('lockScreen'); ls.classList.add('fade-out'); const m = document.getElementById('mainContent'); m.classList.remove('hidden'); setTimeout(() => { m.classList.add('show'); ls.classList.add('hidden'); }, 50); loadFeed(); }

// ===================== 设置 =====================
function openSettings() {
    document.getElementById('setNickname').value = userConfig.nickname || 'User';
    document.getElementById('setKey').value = userConfig.key || '';
    document.getElementById('setPort').value = userConfig.port || 25565;
    pendingFiles = { avatarFile: null, coverFile: null, bgFile: null };
    document.getElementById('previewAvatar').src = (userConfig.avatar && userConfig.avatar !== DEFAULT_AVATAR) ? userConfig.avatar : DEFAULT_AVATAR;
    if (userConfig.cover) { document.getElementById('previewCover').src = userConfig.cover; document.getElementById('previewCover').style.background = 'none'; }
    else { document.getElementById('previewCover').src = ''; document.getElementById('previewCover').style.background = 'linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)'; }
    if (userConfig.bg) { document.getElementById('previewBg').src = userConfig.bg; document.getElementById('previewBg').style.background = 'none'; }
    else { document.getElementById('previewBg').src = ''; document.getElementById('previewBg').style.background = '#1a1a1a'; }
    document.getElementById('fileAvatar').value = ''; document.getElementById('fileCover').value = ''; document.getElementById('fileBg').value = '';
    document.getElementById('settingsPanel').classList.add('show'); document.getElementById('settingsOverlay').classList.add('show'); document.body.style.overflow = 'hidden';
}

function closeSettings() { document.getElementById('settingsPanel').classList.remove('show'); document.getElementById('settingsOverlay').classList.remove('show'); document.body.style.overflow = ''; }

function previewFile(i, pid, fk) {
    const f = i.files[0]; if (!f) return; pendingFiles[fk] = f;
    const r = new FileReader(); r.onload = e => { document.getElementById(pid).src = e.target.result; document.getElementById(pid).style.background = 'none'; }; r.readAsDataURL(f);
}

function resetSettingsImg(t) {
    switch (t) {
        case 'avatar': document.getElementById('previewAvatar').src = DEFAULT_AVATAR; pendingFiles.avatarFile = '__reset__'; document.getElementById('fileAvatar').value = ''; break;
        case 'cover': document.getElementById('previewCover').src = ''; document.getElementById('previewCover').style.background = 'linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)'; pendingFiles.coverFile = '__reset__'; document.getElementById('fileCover').value = ''; break;
        case 'bg': document.getElementById('previewBg').src = ''; document.getElementById('previewBg').style.background = '#1a1a1a'; pendingFiles.bgFile = '__reset__'; document.getElementById('fileBg').value = ''; break;
    }
}

async function uploadSettingsFile(file) {
    const fd = new FormData(); fd.append('image', file);
    return (await (await fetch('/api/upload-settings', { method: 'POST', body: fd })).json()).path;
}

async function saveSettings() {
    const c = { nickname: document.getElementById('setNickname').value.trim() || 'User', avatar: userConfig.avatar, cover: userConfig.cover, bg: userConfig.bg };
    if (pendingFiles.avatarFile === '__reset__') c.avatar = DEFAULT_AVATAR;
    else if (pendingFiles.avatarFile) c.avatar = await uploadSettingsFile(pendingFiles.avatarFile);
    if (pendingFiles.coverFile === '__reset__') c.cover = '';
    else if (pendingFiles.coverFile) c.cover = await uploadSettingsFile(pendingFiles.coverFile);
    if (pendingFiles.bgFile === '__reset__') c.bg = '';
    else if (pendingFiles.bgFile) c.bg = await uploadSettingsFile(pendingFiles.bgFile);
    c.key = document.getElementById('setKey').value.trim();
    c.port = parseInt(document.getElementById('setPort').value) || 25565;
    const newKey = c.key;
    await saveConfig(c);
    userConfig = await loadConfig();
    userConfig.key = newKey || userConfig.key;
    applyConfig(userConfig);
    loadFeed();
    closeSettings();
}

// ===================== 帖子 =====================
async function loadPosts() { return await (await fetch('/api/posts')).json(); }

async function loadFeed() {
    try {
        const posts = await loadPosts();
        const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
        document.getElementById('feed').innerHTML = posts.map(p => {
            let spotify = '';
            if (p.link && p.link.includes('spotify.com')) {
                const eu = p.link.replace(/track\/([a-zA-Z0-9]+)/, 'embed/track/$1');
                spotify = '<div style="margin:12px 0"><iframe style="border-radius:12px" src="'+esc(eu)+'" width="100%" height="'+((p.images && p.images.length>0)||p.image?'80':'152')+'" frameborder="0" allowfullscreen allow="autoplay;clipboard-write;encrypted-media;fullscreen;picture-in-picture" loading="lazy"></iframe></div>';
            }
            const allImg = p.images || (p.image ? [p.image] : []);
            const disp = allImg.slice(0, 9), rem = allImg.length - 9;
            let imghtml = '';
            if (disp.length === 1) {
                imghtml = '<img src="'+disp[0]+'" class="single-img" onclick="openImageViewer('+JSON.stringify(allImg).replace(/"/g,'&quot;')+',0)">';
            } else if (disp.length > 1) {
                const cls = (disp.length === 2 || disp.length === 4) ? 'grid-2col' : 'grid-3col';
                imghtml = '<div class="grid-container '+cls+'">'+disp.map((img, i) => '<div class="grid-item" onclick="openImageViewer('+JSON.stringify(allImg).replace(/"/g,'&quot;')+','+i+')"><img src="'+img+'" loading="lazy">'+(i===disp.length-1&&rem>0?'<div class="grid-more-overlay">+'+rem+'</div>':'')+'</div>').join('')+'</div>';
            }
            return '<div class="feed-item"><img src="'+(userConfig.avatar||DEFAULT_AVATAR)+'" class="feed-avatar"><div class="feed-content"><b>'+esc(userConfig.nickname||'User')+'</b><div class="feed-text">'+(p.text?esc(p.text):'')+'</div>'+spotify+imghtml+'<div class="feed-time">'+esc(p.time||'')+'</div></div><div class="delete-btn" onclick="deletePost('+p.id+')">删除</div></div>';
        }).join('');
    } catch (e) { console.error('加载动态失败:', e); }
}

async function deletePost(id) {
    if (!confirm('确定要删除这条动态吗？')) return;
    await fetch('/api/post/'+id, { method: 'DELETE' });
    loadFeed();
}

async function sendPost() {
    try {
        const text = document.getElementById('postText').value;
        const files = document.getElementById('postFiles').files;
        const link = document.getElementById('postLink').value;
        if (!text && files.length === 0 && !link) return;
        const fd = new FormData(); fd.append('text', text); fd.append('link', link);
        for (let i = 0; i < files.length; i++) fd.append('images', files[i]);
        if (!(await fetch('/api/post', { method: 'POST', body: fd })).ok) throw new Error('服务器异常');
        document.getElementById('postText').value = ''; document.getElementById('postLink').value = '';
        document.getElementById('linkInputArea').classList.remove('show');
        document.getElementById('postFiles').value = ''; document.getElementById('fileNameLabel').innerText = '图片';
        loadFeed();
    } catch (e) { console.error('发布失败:', e); alert('发布失败: ' + e.message); }
}

function toggleLinkInput() { const a = document.getElementById('linkInputArea'); a.classList.toggle('show'); if (a.classList.contains('show')) document.getElementById('postLink').focus(); }

// ===================== 图片查看器 =====================
function openImageViewer(images, startIndex) {
    if (!images || !images.length) return; viewerImages = images; viewerIndex = startIndex || 0;
    const v = document.getElementById('imageViewer'); updateViewerImage(); updateNavArrows();
    document.getElementById('viewerCounter').textContent = images.length > 1 ? (viewerIndex+1)+' / '+images.length : '';
    v.classList.remove('hidden'); requestAnimationFrame(() => v.classList.add('show'));
    document.body.style.overflow = 'hidden'; document.addEventListener('keydown', onViewerKeydown);
}

function updateViewerImage() { const v = document.getElementById('viewerImg'); v.style.opacity = '0'; setTimeout(() => { v.src = viewerImages[viewerIndex]; v.style.opacity = '1'; }, 150); }

function updateNavArrows() {
    document.getElementById('navPrev').classList.toggle('hidden', viewerImages.length <= 1 || viewerIndex === 0);
    document.getElementById('navNext').classList.toggle('hidden', viewerImages.length <= 1 || viewerIndex === viewerImages.length - 1);
}

function navigateViewer(d) { if (viewerIndex+d < 0 || viewerIndex+d >= viewerImages.length) return; viewerIndex += d; updateViewerImage(); updateNavArrows(); document.getElementById('viewerCounter').textContent = (viewerIndex+1)+' / '+viewerImages.length; }

function onViewerKeydown(e) { if (e.key === 'ArrowLeft') { e.preventDefault(); navigateViewer(-1); } else if (e.key === 'ArrowRight') { e.preventDefault(); navigateViewer(1); } else if (e.key === 'Escape') { e.preventDefault(); closeImageViewer(); } }

function closeImageViewer() { const v = document.getElementById('imageViewer'); v.classList.remove('show'); document.removeEventListener('keydown', onViewerKeydown); setTimeout(() => { v.classList.add('hidden'); document.getElementById('viewerImg').src = ''; }, 250); document.body.style.overflow = ''; }

// ===================== 备份 =====================
function backupMsg(msg, isErr) {
    const el = document.getElementById('backupMsg');
    el.textContent = msg;
    el.style.color = isErr ? '#ff4757' : 'var(--primary)';
    setTimeout(() => { el.textContent = ''; }, 4000);
}

async function createBackup() {
    const btn = document.getElementById('btnBackup');
    btn.disabled = true;
    btn.textContent = '正在备份...';
    try {
        const r = await (await fetch('/api/backup', { method: 'POST' })).json();
        if (r.success) backupMsg(`备份完成 (${(r.size / 1024).toFixed(1)} KB)`);
        else backupMsg(r.error, true);
    } catch (e) { backupMsg('备份失败: ' + e.message, true); }
    btn.disabled = false;
    btn.textContent = '创建备份';
}

function downloadBackup() {
    const a = document.createElement('a');
    a.href = '/api/backup/download';
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

async function restoreBackup(input) {
    const file = input.files[0];
    if (!file) return;
    if (!confirm('确定要恢复备份吗？当前数据将被覆盖，建议先下载备份。')) {
        input.value = '';
        return;
    }
    const fd = new FormData();
    fd.append('backup', file);
    try {
        const r = await (await fetch('/api/backup/restore', { method: 'POST', body: fd })).json();
        if (r.success) {
            backupMsg('恢复成功，即将刷新页面');
            userConfig = await loadConfig();
            applyConfig(userConfig);
            loadFeed();
            setTimeout(() => location.reload(), 1000);
        } else {
            backupMsg(r.error, true);
        }
    } catch (e) { backupMsg('恢复失败: ' + e.message, true); }
    input.value = '';
}

init();
</script>
